apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: signalboard
  namespace: flux-system
spec:
  dependsOn:
    - name: flux-system
  interval: 1m0s
  retryInterval: 30s
  path: ./apps/overlays/dev
  prune: true
  wait: true
  timeout: 2m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: signalboard
      namespace: signalboard
