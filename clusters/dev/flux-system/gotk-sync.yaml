apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m0s
  timeout: 30s
  ref:
    branch: main
  url: https://github.com/lioneltchami/lab-to-interview-platform
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m0s
  retryInterval: 30s
  path: ./clusters/dev
  prune: true
  timeout: 2m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
